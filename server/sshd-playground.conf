# Installed as /etc/ssh/sshd_config.d/10-playground.conf by setup-host.sh.
# Files in sshd_config.d are read before sshd_config, and the first value
# set for an option wins, so these override the distro defaults.

# Admins log in with keys only; the play account is the one exception.
PasswordAuthentication no

# Everyone in the room connects at once, usually from one venue NAT address.
# Don't throttle unauthenticated connections or penalize the shared IP
# (PerSourcePenalties needs OpenSSH 9.8+; setup-host.sh drops it on older versions).
MaxStartups 100:30:200
PerSourcePenalties no

Match User play
    PasswordAuthentication yes
    ForceCommand sudo -n /usr/local/bin/playground-shell
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no

# End the Match block so it can't swallow settings read after this file.
Match all
